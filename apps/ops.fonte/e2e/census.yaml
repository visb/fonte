appId: org.fonte.ops
# Story 179 — modal de detalhes do filho na contagem.
#
# A tela de Contagem é COORDINATOR-only (`census: isHouseStaff && a.isCoordinator`
# em features/menu/constants.ts), por isso este fluxo entra pelo
# helpers/login-coordinator.yaml e não pelo login-operator dos demais specs.
#
# Conta com o seed de teste recém-aplicado: 5 filhos ACTIVE na Casa Teste
# (João Testador, Marcelo Reacolhido, Lucas/Marcos/Tiago Elegível). Rodar sobre um
# banco sujo de execuções anteriores muda o denominador e quebra as asserções de
# contador — ver story 182.
#
# A foto em tela cheia NÃO é exercitada aqui: nenhum filho do seed tem `photo_url`,
# então o alvo da foto nasce `disabled` e mostra o ícone de fallback. Cobrir a
# ampliação exigiria semear uma foto — enquanto isso o caminho fica coberto pelo
# unit (ResidentDetailModal.test.tsx) e pelo e2e-web.
---
- runFlow: helpers/login-coordinator.yaml

# Contagem vive na seção "Casa" do menu (story 176).
- tapOn: "Menu"
- waitForAnimationToEnd
- tapOn: "Contagem"
- waitForAnimationToEnd
- assertVisible: "0/5 confirmados"
- assertVisible: "João Testador"

# --- Abre a ficha do filho: consulta, não ação ---
- tapOn: "Detalhes de João Testador"
- waitForAnimationToEnd
- assertVisible: "Detalhes do filho"
- assertVisible: "João Testador"
- assertVisible: "Entrada"
- assertVisible: "Ver ficha completa"

# Fechar o modal não pode confirmar presença — o contador segue zerado.
- tapOn: "Fechar detalhes"
- waitForAnimationToEnd
- assertVisible: "0/5 confirmados"
- assertVisible: "Confirme todos os filhos para concluir."

# --- Confirmar presença segue exclusivamente no botão da linha ---
- tapOn: "Confirmar João Testador"
- waitForAnimationToEnd
- assertVisible: "1/5 confirmados"

# --- "Ver ficha completa" leva à ficha do filho ---
# Por último de propósito: `router.push` para a ficha entra na stack de Filhos,
# então o `back` sai da Contagem e cai no Dashboard. Deixar esta navegação no fim
# evita depender de para onde o `back` volta.
- tapOn: "Detalhes de João Testador"
- waitForAnimationToEnd
- tapOn: "Ver ficha completa"
- waitForAnimationToEnd
- assertVisible: "Visão Geral"
- assertVisible: "Acompanhamento"

# --- Story 209: adicionar filho DIGITANDO as datas ---
# Sessão nova (o login reabre o app limpo) para não depender de para onde o
# `back` da ficha volta. Fixture própria com nome único, removida no fim pelo
# helpers/delete-census-resident.js (story 182). ASCII de propósito: o Maestro
# não digita fora do ASCII (mobile-dev-inc/maestro#146).
- evalScript: ${output.censusName = 'Filho Datas ' + Date.now()}
- runFlow: helpers/login-coordinator.yaml
- tapOn: "Menu"
- waitForAnimationToEnd
- tapOn: "Contagem"
- waitForAnimationToEnd
- tapOn: "Adicionar filho"
- waitForAnimationToEnd
- tapOn: "Nome completo"
- inputText: ${output.censusName}
# O acolhimento vem com hoje: apaga e digita uma data retroativa.
- tapOn: "Data de acolhimento"
- eraseText: 10
- inputText: "01022026"
- assertVisible: "01/02/2026"
# Rótulo e campo têm o mesmo texto: index 1 é o campo (vem depois do rótulo).
- tapOn:
    text: "Data de nascimento"
    index: 1
- inputText: "05031985"
- assertVisible: "05/03/1985"
- hideKeyboard
- tapOn: "Adicionar"
- waitForAnimationToEnd
- assertVisible: ${output.censusName}
- runScript:
    file: helpers/delete-census-resident.js
    env:
      API_URL: http://10.0.2.2:3001/api/v1
      NAME: ${output.censusName}
