appId: org.fonte.ops
---
- runFlow: helpers/login-operator.yaml
- assertVisible: "Bem-vindo,"
- assertVisible: "Operador Teste"
# Story 207: badge de nível do servo logado (seed: Operador Teste = CONSAGRADO).
- assertVisible: "Consagrado"
- assertVisible: "Casa Teste"
# Story 221: contadores Filhos e Servos; "Ocorrências hoje" saiu do dashboard.
- assertVisible: "Filhos na casa"
- assertVisible: "Servos na casa"
- assertNotVisible: "Ocorrências hoje"
- assertVisible: "Ações rápidas"
- assertVisible: "Nova ocorrência"
- assertVisible: "Ver filhos"
- assertVisible: "Ministérios"
# Dispensa escondida dos atalhos por ora (vai voltar).
- assertNotVisible: "Dispensa"
# Story 221: os cards são atalhos para as listas.
- tapOn:
    id: "stat-card-residents"
- assertVisible: "Buscar filho..."
- assertVisible: "João Testador"
- back
- assertVisible: "Servos na casa"
- tapOn:
    id: "stat-card-staff"
- assertVisible: "Coordenador Teste"
- back
- assertVisible: "Bem-vindo,"
