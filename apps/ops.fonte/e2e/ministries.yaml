appId: org.fonte.ops
---
- runFlow: helpers/login-operator.yaml
- tapOn: "Ministérios"
- waitForAnimationToEnd
- assertVisible: "Cozinha"
- tapOn: "Cozinha"
- waitForAnimationToEnd
- assertVisible: "Visão Geral"
- assertVisible: "Tarefas"
- assertVisible: "Líder"
- assertVisible: "Adicionar Servo"
# Story 205: filho em acolhimento volta a ser membro. Adiciona o filho do seed e
# o remove no fim — o seed é só leitura entre execuções (story 182).
- assertVisible: "Adicionar Filho"
- tapOn: "Buscar filho em acolhimento..."
- inputText: "Joao"
- tapOn: "Adicionar João Testador"
- waitForAnimationToEnd
- assertVisible: "Remover João Testador"
- tapOn: "Remover João Testador"
- waitForAnimationToEnd
- assertNotVisible: "Remover João Testador"
- tapOn: "Tarefas"
- waitForAnimationToEnd
- assertVisible: "Nenhuma tarefa cadastrada."
- tapOn: "Nova tarefa"
- assertVisible: "Nova Tarefa"
- tapOn: "Título da tarefa"
# Texto digitado é ASCII de propósito: o Maestro não digita fora do ASCII
# (mobile-dev-inc/maestro#146). Asserção de texto acentuado funciona normalmente.
- inputText: "Lavar pratos"
- tapOn: "Adicionar"
- waitForAnimationToEnd
- assertVisible: "Lavar pratos"
