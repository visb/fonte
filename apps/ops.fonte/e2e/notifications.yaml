appId: org.fonte.ops
---
# Pré-requisito: a API de teste deve ter ao menos uma notificação escopada à casa
# do operador (ex.: gerar uma ocorrência/incidente para a casa antes de rodar).
- runFlow: helpers/login-operator.yaml

# Sino visível no header.
- assertVisible:
    id: "notification-bell"

# Abrir a folha de notificações.
- tapOn:
    id: "notification-bell"
- assertVisible: "Notificações"

# A lista mostra avisos escopados à casa do operador (o backend filtra por houseId).
# Marcar item como lido não entra aqui: o seed não garante notificação, então a
# asserção seria não-determinística — isso vive no unit (NotificationRow).

# Fechar a folha pelo botão de fechar do Modal (`accessibilityLabel="Fechar"`).
# Tocar no título "Notificações" NÃO fecha — era o que este spec fazia, e por
# isso a folha seguia aberta na asserção seguinte.
- tapOn: "Fechar"
- waitForAnimationToEnd
- assertVisible: "Bem-vindo,"
