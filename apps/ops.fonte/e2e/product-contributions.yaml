appId: org.fonte.ops
# Stories 114/195 — declaração de contribuição em PRODUTOS de um filho.
# Fluxo: Menu → Contribuições → Nova declaração → escolher filho → catálogo +
# avulso → declarar → volta para a fila da casa.
# Requer emulador/dispositivo + API de teste (schema 111+112) com catálogo
# semeado na casa. Pré-requisitos de build/ambiente: story 184.
#
# Story 183 — duas escolhas deste spec, conferidas em aparelho:
#
# 1. O filho é o "Marcelo Reacolhido" de propósito: é o único do seed de teste que
#    nasce com plano de contribuição (`family_investment = BASKET_500`, vencimento
#    dia 10) e acolhimento atual em aberto, logo o único cujo carnê vigente se
#    materializa sozinho e tem parcela para declarar. O João Testador entra no seed
#    sem plano — a tela dele devolve "Nenhuma parcela disponível para declarar
#    contribuição.".
#
# 2. O login era o do COORDENADOR porque a tela buscava a parcela corrente em
#    `GET /residents/:id/receivables` (ADMIN/COORDINATOR) e o operador levava 403
#    — "Erro ao carregar o carnê do filho.", independente do filho escolhido.
#
# Story 186 — o login volta a ser o do OPERADOR, que é o ponto do fluxo: a tela
# passou a usar `GET /residents/:id/receivables/summary`, o recorte do carnê
# (mês + status, sem valor nem pagamento), liberado para SERVANT+ como já eram as
# rotas de contribuição em produtos desde a story 112. Este spec é a prova de
# ponta a ponta de que o servo declara produtos sem enxergar o financeiro da
# família — a rota cheia segue ADMIN/COORDINATOR.
---
- runFlow: helpers/login-operator.yaml
- tapOn: "Menu"
- tapOn: "Contribuições"
- tapOn: "Nova declaração"
- tapOn: "Buscar por nome"
# Prefixo sem acento: o Maestro não digita fora do ASCII
# (mobile-dev-inc/maestro#146).
- inputText: "Marcelo"
- assertVisible: "Marcelo Reacolhido"
- hideKeyboard
- tapOn: "Marcelo Reacolhido"
- waitForAnimationToEnd
- assertVisible: "Parcela"

# Linha 1 — do catálogo
- tapOn: "Buscar produto..."
- inputText: "Arroz"
- waitForAnimationToEnd
# Story 183: mesmo problema do storeroom.yaml — `text: "Arroz.*"` casa também com
# o próprio campo de busca (que já contém "Arroz"), então o tap não seleciona
# nada e o form morre em "Selecione um produto". O accessibilityLabel da linha é
# alvo exclusivo do dropdown; o assertVisible é a espera (sem sleep) pelo
# catálogo da casa carregar.
- assertVisible: "Selecionar Arroz"
- tapOn: "Selecionar Arroz"
- tapOn: "Quantidade"
- inputText: "3"
- hideKeyboard

# Linha 2 — avulsa (cesta básica), pendente de detalhamento
- tapOn: "+ Adicionar produto"
- waitForAnimationToEnd
- tapOn:
    text: "Avulso"
    index: 1
- assertVisible: "Ficará pendente de detalhamento."
- tapOn: "Descrição (ex: cesta básica)"
# ASCII de propósito: o Maestro não digita fora do ASCII
# (mobile-dev-inc/maestro#146).
- inputText: "Cesta basica"
- hideKeyboard

- tapOn: "Declarar contribuição"
- waitForAnimationToEnd
- assertVisible: "Contribuição em produtos declarada."
- assertVisible: "Cesta basica"
