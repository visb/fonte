appId: org.fonte.ops
---
- runFlow: helpers/login-resident.yaml
- assertVisible: "João Testador"
- assertVisible: "Use as abas abaixo para acessar mensagens e pedidos"
# Abas Mensagens e Pedidos escondidas por ora (vão voltar): entra pela rota.
- openLink: "ops-fonte://messages"
- waitForAnimationToEnd
- assertVisible: "Tempo restante hoje"
- openLink: "ops-fonte://wishlist"
- waitForAnimationToEnd
- assertVisible: "Tempo restante hoje"
- tapOn: "Início"
- waitForAnimationToEnd
- assertVisible: "João Testador"
- assertVisible: "Use as abas abaixo para acessar mensagens e pedidos"
