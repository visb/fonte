appId: org.fonte.ops
---
- runFlow: helpers/login-resident.yaml
- tapOn: "Pedidos"
- waitForAnimationToEnd
# As abas trazem o contador no rótulo ("Aprovados (1)"). O Maestro casa texto por
# regex de match COMPLETO, então "Aprovados" não bate — daí o `.*`.
- assertVisible: "Aprovados.*"
- assertVisible: "Pendentes.*"
- assertVisible: "Recusados.*"
- tapOn: "Adicionar item"
- assertVisible: "Adicionar item"
- tapOn: "Ex: Bermuda azul tamanho M"
- inputText: "Chinelo azul tamanho 42"
- hideKeyboard
- tapOn: "Adicionar"
- waitForAnimationToEnd
- tapOn: "Pendentes.*"
- assertVisible: "Chinelo azul tamanho 42"
