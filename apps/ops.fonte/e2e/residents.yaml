appId: org.fonte.ops
---
- runFlow: helpers/login-operator.yaml
- tapOn: "Filhos"
- assertVisible: "João Testador"
- tapOn: "Buscar filho..."
# Prefixo sem acento: o Maestro não digita fora do ASCII
# (mobile-dev-inc/maestro#146) e "Jo" já filtra o João Testador.
- inputText: "Jo"
- assertVisible: "João Testador"
- hideKeyboard
- tapOn: "João Testador"
- assertVisible: "Visão Geral"
- assertVisible: "Acompanhamento"
- assertVisible: "Familiares"
- assertVisible: "Anexos"
- tapOn: "Familiares"
- waitForAnimationToEnd
- assertVisible: "Maria Testadora"
- tapOn: "Anexos"
- waitForAnimationToEnd
- assertVisible: "Nenhum anexo adicionado."
