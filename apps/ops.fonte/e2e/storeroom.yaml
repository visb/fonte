appId: org.fonte.ops
---
- runFlow: helpers/login-operator.yaml
- tapOn: "Dispensa"
- waitForAnimationToEnd
- assertVisible: "Arroz"
- tapOn: "Movimentar item"
- waitForAnimationToEnd
- assertVisible: "Entrada"
- tapOn: "Entrada"
- tapOn: "Buscar item..."
- inputText: "Arroz"
- waitForAnimationToEnd
# Story 183: mirar a linha do dropdown pelo accessibilityLabel, não pelo nome do
# item. Depois do inputText o próprio TextInput contém "Arroz", então um
# `tapOn: "Arroz"` casa com o campo de busca, `onSelect` nunca roda e o
# formulário morre em "Selecione um item". O assertVisible também é a espera
# (sem sleep) pela lista do `useStoreroomItems` — a linha só existe depois de
# `items` carregar.
- assertVisible: "Selecionar Arroz"
- tapOn: "Selecionar Arroz"
- tapOn: "0"
- inputText: "5"
# Story 209: a data é digitável. O campo vem com hoje; apaga e lança retroativo.
# O rótulo "Data" e o campo (accessibilityLabel "Data") casam com o mesmo texto:
# index 1 é o campo, que vem depois do rótulo na árvore.
- tapOn:
    text: "Data"
    index: 1
- eraseText: 10
- inputText: "01022026"
- assertVisible: "01/02/2026"
- hideKeyboard
- tapOn: "Registrar entrada"
- waitForAnimationToEnd
- assertVisible: "Movimentação registrada com sucesso."
