# Config TEMPORÁRIA, só-HTTP, para a emissão inicial dos certificados.
#
# O ovo e a galinha: o nginx não sobe com `ssl_certificate` apontando para um
# arquivo que não existe, e o certbot não emite sem o nginx respondendo na porta
# 80. Sobe-se com esta config, emitem-se os três certificados e só então a
# default.conf entra. Passo a passo em README.md (§ Deploy no VPS).
#
# Uso:
#   docker compose -f docker-compose.prod.yml run --rm -v ...  # ver README
#   (monta este arquivo por cima de /etc/nginx/conf.d/default.conf)

server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name adm.fontedemisericordia.com.br
                ops.fontedemisericordia.com.br
                static.fontedemisericordia.com.br;

    include /etc/nginx/snippets/acme-challenge.conf;

    # Nada mais é servido enquanto o TLS não está de pé.
    location / {
        return 503;
    }
}
