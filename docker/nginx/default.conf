# nginx é a porta de entrada única do VPS (story 189): termina TLS, roteia
# /api/v1 para a API, faz proxy do host de storage para o MinIO e serve os
# estáticos dos dois front-ends web deste corte. Nenhum outro serviço publica
# porta.
#
# Hosts:
#   adm.fontedemisericordia.com.br     → /srv/adm  (Vite)      + API
#   ops.fontedemisericordia.com.br     → /srv/ops  (expo web)  + API
#   release.fontedemisericordia.com.br → /srv/release (Vite, SEM API) + APK do ops
#   static.fontedemisericordia.com.br  → MinIO (bucket PRIVADO, só URL assinada)
#
# O console do MinIO (:9001) NÃO tem server block — administração via `mc` no
# host. portal.fonte e app.fonte estão fora deste corte.
#
# Bootstrap do TLS: este arquivo referencia certificados que ainda não existem
# na primeira subida. Ver a ordem em README.md (§ Deploy no VPS) — sobe-se o
# nginx com docker/nginx/bootstrap.conf, emite-se os certificados e só então
# esta config entra.

server_tokens off;

# Limite de corpo casando com o `json({ limit: '10mb' })` da API (main.ts).
# Menor que isso derruba upload com 413 antes de chegar no Node.
client_max_body_size 10m;

# DNS interno do Docker. Os `proxy_pass` usam variável (ver api-proxy.conf) e
# portanto resolvem o nome do serviço a cada request — é o que permite subir o
# nginx com a API ainda fora do ar e sobreviver a um rebuild que troca o IP do
# container.
resolver 127.0.0.11 ipv6=off valid=10s;

# Necessário para o upgrade de WebSocket do socket.io (snippets/api-proxy.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP: ACME primeiro, redirect depois ─────────────────────────────────────
# Um server de porta 80 por host. O `location` do acme-challenge vem ANTES do
# redirect (é `^~`, então tem precedência sobre o prefixo `/`).
server {
    listen 80;
    listen [::]:80;
    server_name adm.fontedemisericordia.com.br
                ops.fontedemisericordia.com.br
                release.fontedemisericordia.com.br
                static.fontedemisericordia.com.br;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── adm.fonte ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name adm.fontedemisericordia.com.br;

    ssl_certificate     /etc/letsencrypt/live/adm.fontedemisericordia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adm.fontedemisericordia.com.br/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    root /srv/adm;
    index index.html;

    include /etc/nginx/snippets/api-proxy.conf;
    include /etc/nginx/snippets/static-app.conf;
}

# ── ops.fonte (web) ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ops.fontedemisericordia.com.br;

    ssl_certificate     /etc/letsencrypt/live/ops.fontedemisericordia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.fontedemisericordia.com.br/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    root /srv/ops;
    index index.html;

    include /etc/nginx/snippets/api-proxy.conf;
    include /etc/nginx/snippets/static-app.conf;
}

# ── hosts opcionais (story 213) ──────────────────────────────────────────────
# Server blocks que só entram quando o certificado do host já existe:
# docker/nginx/sites/<host>.conf → /etc/nginx/sites-available, habilitados por
# docker/nginx/enable-sites.sh (no boot e antes de cada reload). Hoje:
#   release.fontedemisericordia.com.br → /srv/release (release.fonte, SEM API)
# Glob vazio é válido: sem certificado, o host simplesmente não tem server 443
# e os demais seguem no ar.
include /etc/nginx/sites-enabled/*.conf;

# ── storage (MinIO) ──────────────────────────────────────────────────────────
# Host DEDICADO, não um path: a assinatura do presign cobre o host, então a URL
# entregue ao cliente tem de bater exatamente com o endpoint que assinou
# (AWS_ENDPOINT_URL=https://static.fontedemisericordia.com.br). Assinar com
# http://minio:9000 e servir por outro host dá SignatureDoesNotMatch em toda
# imagem.
#
# Apesar do nome, o bucket é PRIVADO: nada aqui abre leitura anônima. O que
# libera o objeto é a query de assinatura emitida pelo StorageUrlInterceptor.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name static.fontedemisericordia.com.br;

    ssl_certificate     /etc/letsencrypt/live/static.fontedemisericordia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/static.fontedemisericordia.com.br/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    # O limite de 10m é da API. Aqui trafega também o dump do backup (story 20),
    # que passa de centenas de MB — limitar quebraria o backup semanal.
    client_max_body_size 0;

    location / {
        # Variável pelo mesmo motivo do proxy da API: não travar o boot do nginx
        # quando o container do MinIO ainda não existe.
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upload grande em streaming, sem bufferizar no disco do nginx.
        proxy_request_buffering off;
        proxy_buffering off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
