# ── release.fonte (story 213) ────────────────────────────────────────────────
# Site público de versões: download do APK do ops + changelog. Estático e SEM
# api-proxy — não fala com a API. Aberto, sem login (decisão da story).
#
# Server OPCIONAL: mora em /etc/nginx/sites-available e só é habilitado (link em
# sites-enabled, incluído pela default.conf) quando o certificado do host já
# existe — quem decide é docker/nginx/enable-sites.sh, no boot e antes de cada
# reload. Motivo: `ssl_certificate` apontando para arquivo inexistente impede o
# nginx de subir, e esta config chega à produção pelo deploy automático da main,
# possivelmente ANTES de o certificado do host novo ser emitido. Sem o guarda,
# um host novo derrubaria adm, ops e storage junto.
#
# (Caminho do certificado com variável não serve: aí quem lê a chave é o worker,
# sem permissão no privkey.pem 0600 do certbot — provado em teste local.)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name release.fontedemisericordia.com.br;

    ssl_certificate     /etc/letsencrypt/live/release.fontedemisericordia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/release.fontedemisericordia.com.br/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    root /srv/release;
    index index.html;

    # APK + manifesto, copiados da imagem fonte-apk pelo stage `web`. `^~` vence
    # os locations de regex do static-app.conf, e o try_files SEM fallback de
    # SPA garante 404 real quando ainda não há APK (a home lê o 404 de
    # latest.json como "APK ainda não publicado").
    location ^~ /downloads/ {
        types {
            application/vnd.android.package-archive apk;
            application/json                         json;
        }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Versionado (ops-1.2.0.apk) é imutável: cache longo.
        location ~ ^/downloads/ops-[^/]+\.apk$ {
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # ops.apk (link fixo) e latest.json mudam a cada release: cache curto.
        location = /downloads/ops.apk {
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "public, max-age=300" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location = /downloads/latest.json {
            add_header Cache-Control "no-cache" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        try_files $uri =404;
    }

    include /etc/nginx/snippets/static-app.conf;
}
