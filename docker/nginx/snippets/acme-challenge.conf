# Desafio HTTP-01 do Let's Encrypt. Vai em TODO `server` de porta 80, ANTES do
# redirect para HTTPS: o desafio chega em HTTP puro, e um redirect cego 80→443
# quebra a renovação (e o site cai 90 dias depois, quando o cert vence).
# `root` compartilhado com o container do certbot pelo volume `certbot_www`.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
}
