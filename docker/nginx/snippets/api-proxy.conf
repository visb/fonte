# Proxy da API. O prefixo casa com `setGlobalPrefix("api/v1")` do main.ts.
# Servido no MESMO host de cada front-end, então a chamada é same-origin e não
# gera preflight; CORS_ORIGIN continua listando os dois hosts para o caso de
# apontar um app para o domínio do outro.
#
# `proxy_pass` com VARIÁVEL de propósito: com host literal o nginx resolve o
# nome no load da config e se recusa a subir ("host not found in upstream") se o
# container `api` ainda não existe — o que trava a stack inteira num rebuild da
# API e faz o `nginx -s reload` da renovação de certificado falhar. Com variável
# a resolução é por request, via `resolver` (DNS interno do Docker) declarado na
# default.conf: API fora do ar vira 502, não nginx morto.
location /api/v1/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Geração de PDF (puppeteer) e relatórios grandes passam de 60s.
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

# socket.io do NotificationGateway (namespace /notifications). O handshake sobe
# em /socket.io/, fora do prefixo /api/v1 — sem este bloco o sino de
# notificações do adm fica mudo em produção.
location /socket.io/ {
    set $ws_upstream http://api:3000;
    proxy_pass $ws_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
