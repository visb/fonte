# Serviço dos front-ends estáticos. Idêntico para adm e ops — o `server` que
# inclui este arquivo só precisa definir o `root`. É o que faz o portal entrar
# depois com um COPY e um `server` block, sem reescrever regra de rota.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/wasm
    application/manifest+json
    image/svg+xml;

# HTML nunca é cacheado — inclui o /index.html e, no ops (expo export
# `output: 'static'`), o .html de cada rota. Sem isso, deploy novo continua
# servindo bundle velho; no ops, que é offline-first e guarda fila de mutations,
# bundle velho com backend novo é o cenário ruim.
location ~* \.html$ {
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Assets com hash no nome: cache longo e imutável.
location ~* \.(?:js|mjs|css|map|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Fallback de SPA. `$uri.html` atende o export estático do Expo (ops), onde
# /login é o arquivo login.html; no adm (Vite) esse termo nunca casa e a rota
# cai direto no /index.html, que é o comportamento de SPA esperado. Deep link
# (ex.: /residents/<id>) resolve pelo cliente em vez de dar 404.
#
# O `Cache-Control` repete aqui de propósito: quando o try_files resolve por
# `$uri/index.html` (é o caso da raiz `/`) o arquivo é servido DESTE location,
# sem redirect interno, e o bloco `~* \.html$` acima nunca roda. Sem esta linha
# a home volta cacheável e o deploy novo continua servindo bundle velho.
location / {
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri.html $uri/index.html /index.html;
}
