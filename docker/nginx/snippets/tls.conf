# Parâmetros de TLS comuns aos três hosts. O par de certificados é por host e
# fica no `server` que inclui este arquivo (o caminho muda com o server_name).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
